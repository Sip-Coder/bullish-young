<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bullish Young — Screener</title><link rel="stylesheet" href="assets/app.css"></head><body><main><h1>Stock Screener</h1><div class="toolbar"><button data-preset="strict">Strict value</button><button data-preset="growth">AI growth</button><button data-preset="reset">Reset</button><span class="count"></span></div><div class="filters"><label>P/E max<input id="pe" type="number"></label><label>Fwd P/E max<input id="fpe" type="number"></label><label>ROE min (%)<input id="roe" type="number"></label><label>Debt/Eq max<input id="de" type="number" step=".1"></label><label>FCF<select id="fcf"><option>Any</option><option>Positive</option><option>Negative</option></select></label><label>Price vs 50D<select id="ma50"><option>Any</option><option>Above</option><option>Below</option></select></label><label>Price vs 200D<select id="ma200"><option>Any</option><option>Above</option><option>Below</option></select></label><label>Sector<select id="sector"><option>All</option></select></label></div><div class="table-wrap"><table><thead><tr id="heads"></tr></thead><tbody></tbody></table></div></main><script src="assets/common.js"></script><script src="assets/screener.js"></script></body></html>
