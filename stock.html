<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bullish Young — Stock</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a8a3a'/%3E%3Cpath d='M14 43 27 30l9 8 15-18' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/brooks.css" />
    <link rel="stylesheet" href="assets/polish.css" />
    <link rel="stylesheet" href="assets/mobile.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <main id="stock-main">
      <div class="stock-head"></div>
      <div class="toolbar">
        <button data-type="candles" class="active">Candles</button
        ><button data-type="bars">Bars</button
        ><button data-type="line">Line</button
        ><button id="sma50" class="active">50-bar SMA</button
        ><button id="sma200" class="active">200-bar SMA</button
        ><button id="hline">H-line</button
        ><button id="clear-lines">Clear lines</button
        ><label class="brooks-toggle"
          ><input id="brooks" type="checkbox" /> Brooks (reference)</label
        ><span id="brooks-layers" hidden
          ><label><input id="bar-types" type="checkbox" /> Bar types</label
          ><label
            ><input id="inside-outside" type="checkbox" /> Inside/outside</label
          ></span
        ><span class="ohlc"></span>
      </div>
      <div id="brooks-badge" class="brooks-badge" hidden></div>
      <div class="chart-box"><div id="chart"></div></div>
      <div class="chart-note">
        Indicator inspired by Al Brooks' price action concepts; not affiliated.
      </div>
      <div class="chart-controls">
        <label>Bar interval
          <select id="bar-interval" aria-label="Bar interval">
            <option value="1m">1m</option><option value="5m">5m</option
            ><option value="10m">10m</option><option value="15m">15m</option
            ><option value="30m">30m</option><option value="1h">1h</option
            ><option value="2h">2h</option><option value="4h">4h</option
            ><option value="daily" selected>Daily</option
            ><option value="weekly">Weekly</option
            ><option value="monthly">Monthly</option
            ><option value="quarterly">Quarterly</option>
          </select>
        </label>
        <label>Date range
          <select id="date-range" aria-label="Date range">
            <option value="1M">1M</option><option value="2M">2M</option
            ><option value="3M">3M</option><option value="4M">4M</option
            ><option value="6M" selected>6M</option><option value="9M">9M</option
            ><option value="YTD">YTD</option><option value="1Y">1Y</option
            ><option value="2Y">2Y</option><option value="3Y">3Y</option
            ><option value="5Y">5Y</option><option value="10Y">10Y</option
            ><option value="MAX">MAX</option>
          </select>
        </label>
        <button id="log-scale" aria-pressed="false">Log scale</button>
      </div>
      <div id="chart-availability" class="chart-availability muted" aria-live="polite"></div>
      <div class="chart-availability muted">Intraday data is refreshed hourly, so the latest bars may lag by up to an hour.</div>
      <section id="trade-calc"></section>
      <section id="statistics"></section>
    </main>
    <script src="assets/common.js"></script>
    <script src="assets/brooks.js"></script>
    <script src="assets/stock.js"></script>
  </body>
</html>
