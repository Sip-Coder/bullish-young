<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bullish Young — Stock</title>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/brooks.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <main id="stock-main">
      <div class="stock-head"></div>
      <div class="toolbar">
        <button data-type="candles" class="active">Candles</button
        ><button data-type="bars">Bars</button
        ><button data-type="line">Line</button
        ><button id="sma50" class="active">50D SMA</button
        ><button id="sma200" class="active">200D SMA</button
        ><button id="hline">H-line</button
        ><button id="clear-lines">Clear lines</button
        ><label class="brooks-toggle"
          ><input id="brooks" type="checkbox" /> Brooks (reference)</label
        ><span id="brooks-layers" hidden
          ><label><input id="bar-types" type="checkbox" /> Bar types</label
          ><label
            ><input id="inside-outside" type="checkbox" /> Inside/outside</label
          ></span
        ><span class="ohlc"></span>
      </div>
      <div id="brooks-badge" class="brooks-badge" hidden></div>
      <div class="chart-box"><div id="chart"></div></div>
      <div class="chart-note">
        Indicator inspired by Al Brooks' price action concepts; not affiliated.
      </div>
      <div class="toolbar ranges">
        <button data-days="30">1M</button><button data-days="90">3M</button
        ><button data-days="180">6M</button><button data-days="365">1Y</button
        ><button data-days="730">2Y</button>
      </div>
      <section id="statistics"></section>
    </main>
    <script src="assets/common.js"></script>
    <script src="assets/brooks.js"></script>
    <script src="assets/stock.js"></script>
  </body>
</html>
